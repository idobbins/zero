[workspace]
resolver = "2"
members = [
    "crates/client",
    "crates/server"
]

[workspace.package]
publish = false
edition = "2024"

[workspace.dependencies]

#
# Workspace member crates
#

#
# External crates
#

anyhow = "1.0.98"
argon2 = "0.5.3"
axum = "0.8.4"
chrono = "0.4.41"
clap = "4.5.39"
dotenvy = "0.15.7"
reqwest = "0.11"
serde = "1.0.219"
serde_json = "1.0"
diesel = "2.2.10"
diesel-async = "0.5.2"
diesel_async_migrations = "0.15.0"
lettre = "0.11.17"
tokio = "1.45.0"
tower-http = "0.6.6"
tower-sessions = "0.14.0"
tracing = "0.1.41"
tracing-subscriber = "0.3.19"
uuid = "1.17.0"

# These are needed for diesel to work on windows
pq-sys = "0.7.1"
openssl-sys = "0.9.100"