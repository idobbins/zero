[package]
name = "zero"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.98"
askama = { version = "0.14.0" }
axum = { version = "0.8.4", features = ["macros"] }
futures = "0.3"
inventory = "0.3"
serde_json = "1.0"
tokio = {version = "1.45.1", features = ["macros", "rt-multi-thread", "signal"] }
tokio-stream = "0.1"
tower = "0.5"
tower-http = { version = "0.6", features = ["fs"] }
zero-macros = { path = "zero-macros" }
